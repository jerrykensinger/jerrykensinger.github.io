name: Archive NFL weekly records

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Archive completed NFL week
        run: python3 scripts/archive_nfl_week.py

      - name: Commit history update
        run: |
          if git diff --quiet -- nfl-weekly-history.json; then
            echo "No weekly history changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nfl-weekly-history.json
          git commit -m "Archive completed NFL week"
          git push
